services:
  backend:
    build: ./backend_py
    restart: unless-stopped
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ALLOWED_ORIGINS: https://${DOMAIN}
      PUBLIC_BASE_URL: https://${DOMAIN}
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - quota:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/dist:/srv:ro
      - caddy_data:/data

volumes:
  quota:
  caddy_data:
